name: Playwright Tests

on:
    push:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
        - name: 코드 가져오기
          uses: actions/checkout@v4

        - name: 파이썬 설치
          uses: actions/setup-python@v5
          with:
              python-version: '3.10'

        - name: 필요한 도구 설치
          run: |
              pip install -r requirements.txt
              playwright install --with-deps

        - name: 테스트 실행
          run: pytest -s
name: Playwright Tests

on:
  push:
    branches: [ main ]

# 1. 깃허브 페이지에 보고서를 올릴 수 있는 권한 허용
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 도구 설치
        run: |
          pip install -r requirements.txt
          pip install allure-pytest
          playwright install --with-deps

      - name: 테스트 실행 (Allure 데이터 생성)
        # --alluredir 옵션으로 데이터를 한곳에 모읍니다.
        run: pytest -s --alluredir=allure-results
        continue-on-error: true # 테스트가 실패해도 보고서는 만들어야 하므로 중단 방지

      - name: Allure 보고서 생성 및 업로드
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: 깃허브 페이지로 보고서 배포
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report